name: Publication vérifiée du jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rpg-verified-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Vérifier les tests du jeu et la publication
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node tests/run.cjs
      - name: Préparer la version exacte
        run: node tools/release.cjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 900000
      - name: Confirmer les fichiers réellement disponibles
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/verify-release.cjs "$SITE_URL" _site/release.json --wait=240
